services:
  db:
    image: postgres:16-alpine
    container_name: todo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: ToDoAppContext
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: todo_web
    ports:
      - "5000:8080" 
    environment:
      - ConnectionStrings__ToDoAppContext=Host=db;Port=5432;Database=ToDoAppContext;Username=postgres;Password=12345
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: todo_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
